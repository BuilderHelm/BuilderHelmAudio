name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.0", "16.4"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Release build
        run: swift build -c release
      - name: Unit tests (no model downloads)
        run: swift test
      - name: Validate privacy manifest
        run: plutil -lint Sources/BuilderHelmAudio/PrivacyInfo.xcprivacy

  ios:
    name: iOS Simulator build and unit tests
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test on an installed iPhone simulator
        run: bash Scripts/ci-ios.sh
