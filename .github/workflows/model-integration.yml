name: Real-model integration

# A separate inference gate for changes that can affect real-model behavior.
on:
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/model-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Pinned 110M + V3 models and runtime parity
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      BUILDERHELM_INTEGRATION: "1"
      # Hosted runners do not establish Neural Engine or real iPhone performance.
      BUILDERHELM_TEST_COMPUTE: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and host
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          uname -m
      - name: Cache pinned model downloads (not compiled device caches)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Application Support/BuilderHelmAudio/Models
          key: bhaudio-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Sources/BuilderHelmAudio/AsrModel.swift') }}
      - name: Integration tests (rehash cached models, then run real inference)
        run: swift test -c release --filter RealModelTests
      # Temporary candidate qualification. The pinned export above must still pass
      # before release; this step tests the frontend repair before publishing it.
      - name: Python for candidate qualification
        if: failure()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Qualify bounded V3 frontend candidate
        if: failure()
        run: |
          python3.11 -m venv "$RUNNER_TEMP/v3-stage-env"
          "$RUNNER_TEMP/v3-stage-env/bin/pip" install coremltools==9.0 numpy==1.26.4
          source_model="$(.build/release/bhaudio download parakeet-tdt-0.6b-v3)"
          "$RUNNER_TEMP/v3-stage-env/bin/python" Scripts/ParakeetV3/stage_preprocessor.py "$source_model" "$RUNNER_TEMP/v3-bounded-candidate"
          BUILDERHELM_V3_MODEL_DIRECTORY="$RUNNER_TEMP/v3-bounded-candidate" swift test -c release --filter 'RealModelTests/v3'
